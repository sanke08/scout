<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scout</title>
    <!-- The font stylesheet is optional: without it the page uses the system fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Scout</h1>
        <nav aria-label="Pages">
          <a href="#digest" id="navDigest">Digest</a>
          <a href="#profile" id="navProfile">Profile</a>
          <a href="#applications" id="navApplications"
            >Applications<span class="badge" id="applicationsBadge" hidden></span
          ></a>
          <a href="#settings" id="navSettings">Settings</a>
        </nav>
      </header>
      <ul class="status" id="statusLine"></ul>
      <div class="banner" id="errorBanner" role="alert" hidden></div>

      <div id="viewDigest"></div>
      <div id="viewProfile" hidden></div>
      <div id="viewApplications" hidden></div>
      <div id="viewSettings" hidden></div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
