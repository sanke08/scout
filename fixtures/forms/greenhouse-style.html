<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply: Backend Engineer at ExampleCorp (fictional Greenhouse-style form)</title>
  </head>
  <body>
    <header><h1>Backend Engineer</h1><p>ExampleCorp, Remote (Europe)</p></header>
    <form id="application_form" action="https://example.com/apply" method="post">
      <input type="hidden" name="authenticity_token" value="not-a-real-token" />
      <div class="field">
        <label for="first_name">First Name <span>*</span></label>
        <input id="first_name" name="job_application[first_name]" type="text" required />
      </div>
      <div class="field">
        <label for="last_name">Last Name <span>*</span></label>
        <input id="last_name" name="job_application[last_name]" type="text" required />
      </div>
      <div class="field">
        <label for="email">Email <span>*</span></label>
        <input id="email" name="job_application[email]" type="email" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="job_application[phone]" type="tel" />
      </div>
      <div class="field">
        <label for="resume">Resume/CV <span>*</span></label>
        <input id="resume" name="job_application[resume]" type="file" accept=".pdf,.doc,.docx" required />
      </div>
      <div class="field">
        <label for="cover_letter">Cover Letter</label>
        <input id="cover_letter" name="job_application[cover_letter]" type="file" accept=".pdf" />
      </div>
      <div class="field">
        <label for="linkedin">LinkedIn Profile</label>
        <input id="linkedin" name="job_application[urls][linkedin]" type="url" />
      </div>
      <div class="field">
        <label for="source">How did you hear about this job?</label>
        <input id="source" name="job_application[answers][source]" type="text" />
      </div>
      <div class="field">
        <label for="eu_work">Are you authorised to work in the EU? *</label>
        <select id="eu_work" name="job_application[answers][eu_work]" required>
          <option value="">Please select</option>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>
      <div class="field">
        <label for="why">Why do you want to work at ExampleCorp? *</label>
        <textarea id="why" name="job_application[answers][why]" required></textarea>
      </div>
      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="job_application[demographic][gender]">
          <option value="">Please select</option>
          <option value="1">Female</option>
          <option value="2">Male</option>
          <option value="3">Non-binary</option>
          <option value="4">I do not wish to answer</option>
        </select>
      </div>
      <div class="field" style="display: none">
        <label for="website_hp">Leave this empty</label>
        <input id="website_hp" name="website_hp" type="text" />
      </div>
      <input type="submit" id="submit_app" value="Submit Application" />
    </form>
  </body>
</html>
